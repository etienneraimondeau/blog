<html lang="en">

{% include head.html %}

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">
        <div class="inner">
              <span class="image">
                    <img src="{{page.image }}" alt="" />
            </span>
            <header class="major">
                <h1>{{ page.title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ page.description }}</p>
            </div>
        </div>
    </section>

<!-- Main -->
<div id="main">

<!-- Content -->
<section id="one">
	<div class="inner">
		{{ content }}
	</div>
</section>

<!-- Contact form -->
<section id="contact">
	<div class="inner">
		<form action="https://formspree.io/f/{{ site.email }}" method="POST">
			<h3>Tell me about your project:</h3><br>
			<div class="field half first">
				<label for="name">Full Name (required)</label>
				<input type="text" name="name" id="name" />
			</div>
			<div class="field half">
				<label for="email">Email (required)</label>
				<input type="text" name="_replyto" id="email" />
			</div>
			<div class="field">
				<label for="project">What are you working on?</label>
				<input type="text" name="project" id="project" placeholder="e.g. publication figure, pitch deck, outreach campaign..." />
			</div>
			<div class="field">
				<label for="message">Tell me more</label>
				<textarea name="message" id="message" rows="6" placeholder="Audience, timeline, any specific requirements..."></textarea>
			</div>
			<ul class="actions">
				<li><input type="submit" value="Send Message" class="special" /></li>
				<li><input type="reset" value="Clear" /></li>
			</ul>
		</form>
	</div>
</section>

</div>
    {% include footer.html %}

</body>

</html>
