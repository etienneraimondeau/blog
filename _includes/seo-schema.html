{% if page.collection == 'posts' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  {% if page.image %}"image": {{ page.image | absolute_url | jsonify }},{% endif %}
  "url": {{ page.url | absolute_url | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Etienne Raimondeau",
    "url": {{ "/about/" | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "url": {{ site.url | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ "/assets/images/favicon.svg" | absolute_url | jsonify }}
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  }
}
</script>
{% elsif page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | jsonify }},
  "logo": {{ "/assets/images/favicon.svg" | absolute_url | jsonify }},
  "sameAs": [
    {{ site.linkedin_url | jsonify }},
    {{ site.instagram_url | jsonify }},
    {{ site.behance_url | jsonify }},
    {{ site.redbubble_url | jsonify }}
  ]
}
</script>
{% elsif page.url == '/about/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": "Scientific information design studio — science illustration, data visualisation, and visual stories for biotech companies and academic researchers.",
  "founder": {
    "@type": "Person",
    "name": "Etienne Raimondeau",
    "jobTitle": "PhD Biochemist & Scientific Information Designer",
    "alumniOf": { "@type": "Organization", "name": "EMBL Grenoble" }
  },
  "areaServed": "GB",
  "priceRange": "££",
  "knowsAbout": ["Scientific Illustration", "Data Visualisation", "Bioinformatics", "Biotech", "Mechanism of Action Figures"]
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": {{ page.title | default: site.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "url": {{ site.url | jsonify }}
  }
}
</script>
{% endif %}
